<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="bottleGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="20%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cork" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="shadowBottle" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#78350f" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg1l)"/>
  <circle cx="400" cy="300" r="230" fill="none" stroke="#d97706" stroke-opacity="0.15" stroke-width="40"/>

  <!-- 1 Litre Bottle -->
  <g filter="url(#shadowBottle)">
    <!-- Wooden Cork Top -->
    <rect x="375" y="110" width="50" height="30" rx="4" fill="url(#cork)"/>
    <ellipse cx="400" cy="110" rx="25" ry="8" fill="#f59e0b"/>

    <!-- Neck -->
    <path d="M 370 140 L 430 140 L 420 220 L 380 220 Z" fill="url(#bottleGlass)"/>

    <!-- Main Bottle Body -->
    <path d="M 380 220 C 340 250, 330 270, 330 300 L 330 470 C 330 490, 345 500, 365 500 L 435 500 C 455 500, 470 490, 470 470 L 470 300 C 470 270, 460 250, 420 220 Z" fill="url(#bottleGlass)"/>

    <!-- Glass Reflection Highlight -->
    <path d="M 345 300 L 345 470 C 345 480, 350 485, 355 485 L 360 485 L 360 300 Z" fill="#ffffff" opacity="0.45"/>

    <!-- Label -->
    <rect x="350" y="290" width="100" height="150" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <rect x="356" y="296" width="88" height="138" rx="6" fill="#fffbeb"/>

    <!-- Emblem -->
    <circle cx="400" cy="335" r="18" fill="#d97706"/>
    <path d="M 400 322 C 400 322 388 340 400 348 C 412 340 400 322 400 322 Z" fill="#ffffff"/>

    <text x="400" y="375" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle" fill="#78350f">1 LITRE</text>
    <text x="400" y="395" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="middle" fill="#b45309" letter-spacing="1">BOTTLE</text>
    <text x="400" y="415" font-family="sans-serif" font-weight="500" font-size="8" text-anchor="middle" fill="#92400e">DAILY USE</text>
  </g>
</svg>
