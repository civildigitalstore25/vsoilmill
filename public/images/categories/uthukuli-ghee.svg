<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGhee" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="gheeJar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="gheeCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="shadowGhee" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#a16207" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGhee)"/>
  <circle cx="400" cy="300" r="230" fill="none" stroke="#eab308" stroke-opacity="0.2" stroke-width="40"/>

  <!-- Uthukuli Ghee Jar -->
  <g filter="url(#shadowGhee)">
    <!-- Golden Lid -->
    <rect x="310" y="160" width="180" height="40" rx="10" fill="url(#gheeCap)"/>
    <rect x="300" y="190" width="200" height="15" rx="4" fill="#78350f"/>

    <!-- Glass Jar Body -->
    <path d="M 315 205 C 290 230, 270 270, 270 330 L 270 450 C 270 480, 290 500, 320 500 L 480 500 C 510 500, 530 480, 530 450 L 530 330 C 530 270, 510 230, 485 205 Z" fill="url(#gheeJar)"/>

    <!-- Grainy Ghee Texture Accent Lines -->
    <ellipse cx="400" cy="270" rx="100" ry="12" fill="#fef08a" opacity="0.6"/>
    <ellipse cx="400" cy="310" rx="115" ry="14" fill="#fef9c3" opacity="0.5"/>
    <ellipse cx="400" cy="360" rx="120" ry="16" fill="#fef08a" opacity="0.4"/>

    <!-- Front Label -->
    <rect x="325" y="280" width="150" height="170" rx="12" fill="#ffffff" stroke="#eab308" stroke-width="2"/>
    <rect x="333" y="288" width="134" height="154" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>

    <!-- Cow Silhouette Emblem / Crown -->
    <circle cx="400" cy="330" r="22" fill="#ca8a04"/>
    <path d="M 390 330 L 400 318 L 410 330 L 405 342 L 395 342 Z" fill="#ffffff"/>

    <text x="400" y="375" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle" fill="#78350f">UTHUKULI</text>
    <text x="400" y="398" font-family="sans-serif" font-weight="800" font-size="14" text-anchor="middle" fill="#a16207" letter-spacing="1">A2 COW GHEE</text>
    <text x="400" y="420" font-family="sans-serif" font-weight="600" font-size="10" text-anchor="middle" fill="#ca8a04">BILONA METHOD</text>
  </g>
</svg>
