<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="50%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="canBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="30%" stop-color="#22c55e"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="oilLevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadowCan" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#14532d" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg5l)"/>
  <circle cx="400" cy="300" r="230" fill="none" stroke="#22c55e" stroke-opacity="0.15" stroke-width="36"/>

  <!-- 5 Litre Can Container -->
  <g filter="url(#shadowCan)">
    <!-- Main Plastic Can Body -->
    <rect x="290" y="180" width="220" height="300" rx="28" fill="url(#canBody)"/>

    <!-- Molded Handle -->
    <path d="M 450 200 L 490 200 C 510 200 510 320 490 320 L 450 320 Z" fill="#14532d"/>
    <path d="M 460 220 L 485 220 C 495 220 495 300 485 300 L 460 300 Z" fill="#dcfce7"/>

    <!-- Spout & Yellow Screw Cap -->
    <rect x="330" y="145" width="45" height="35" rx="6" fill="#14532d"/>
    <rect x="325" y="130" width="55" height="25" rx="6" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <line x1="330" y1="138" x2="375" y2="138" stroke="#fef08a" stroke-width="2"/>
    <line x1="330" y1="145" x2="375" y2="145" stroke="#b45309" stroke-width="2"/>

    <!-- Transparent Level Strip -->
    <rect x="310" y="210" width="18" height="240" rx="9" fill="#ffffff" opacity="0.4"/>
    <rect x="313" y="240" width="12" height="205" rx="6" fill="url(#oilLevel)"/>

    <!-- Label -->
    <rect x="340" y="230" width="145" height="200" rx="12" fill="#ffffff"/>
    <rect x="348" y="238" width="129" height="184" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>

    <!-- Sunflower / Seed Icon -->
    <circle cx="412" cy="285" r="24" fill="#f59e0b"/>
    <circle cx="412" cy="285" r="14" fill="#78350f"/>

    <text x="412" y="340" font-family="sans-serif" font-weight="900" font-size="22" text-anchor="middle" fill="#14532d">5 LITRE</text>
    <text x="412" y="365" font-family="sans-serif" font-weight="700" font-size="12" text-anchor="middle" fill="#15803d" letter-spacing="2">CAN PACK</text>
    <text x="412" y="390" font-family="sans-serif" font-weight="500" font-size="10" text-anchor="middle" fill="#166534">FAMILY SAVER</text>
  </g>
</svg>
