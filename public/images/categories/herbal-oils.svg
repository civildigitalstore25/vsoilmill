<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHerbal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="50%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="herbalBottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="30%" stop-color="#047857"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="dropperCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadowHerbal" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#064e3b" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgHerbal)"/>
  <circle cx="400" cy="300" r="230" fill="none" stroke="#10b981" stroke-opacity="0.2" stroke-width="40"/>

  <!-- Herbal Botanical Leaves Background Elements -->
  <g opacity="0.3">
    <path d="M 220 200 C 180 150, 160 220, 240 260 C 260 220, 260 180, 220 200 Z" fill="#059669"/>
    <path d="M 580 200 C 620 150, 640 220, 560 260 C 540 220, 540 180, 580 200 Z" fill="#059669"/>
    <path d="M 200 400 C 150 420, 210 480, 260 430 C 240 390, 200 380, 200 400 Z" fill="#10b981"/>
    <path d="M 600 400 C 650 420, 590 480, 540 430 C 560 390, 600 380, 600 400 Z" fill="#10b981"/>
  </g>

  <!-- Dark Emerald Glass Bottle with Dropper -->
  <g filter="url(#shadowHerbal)">
    <!-- Dropper Bulb Top -->
    <path d="M 385 100 C 385 85, 415 85, 415 100 L 415 125 L 385 125 Z" fill="#374151"/>
    <!-- Dropper Cap Collar -->
    <rect x="375" y="125" width="50" height="35" rx="6" fill="url(#dropperCap)"/>

    <!-- Neck -->
    <rect x="382" y="160" width="36" height="40" fill="#064e3b"/>

    <!-- Main Bottle Body -->
    <path d="M 382 200 C 340 230, 330 260, 330 290 L 330 460 C 330 485, 345 500, 365 500 L 435 500 C 455 500, 470 485, 470 460 L 470 290 C 470 260, 460 230, 418 200 Z" fill="url(#herbalBottle)"/>

    <!-- Glass Reflection Highlight -->
    <path d="M 345 290 L 345 460 C 345 475, 350 480, 355 480 L 360 480 L 360 290 Z" fill="#ffffff" opacity="0.25"/>

    <!-- Label -->
    <rect x="350" y="280" width="100" height="160" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <rect x="356" y="286" width="88" height="148" rx="6" fill="#f0fdf4"/>

    <!-- Herbal Leaf Emblem -->
    <circle cx="400" cy="325" r="18" fill="#059669"/>
    <path d="M 400 312 C 390 325, 395 338, 400 338 C 405 338, 410 325, 400 312 Z" fill="#ecfdf5"/>

    <text x="400" y="365" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle" fill="#064e3b">HERBAL</text>
    <text x="400" y="385" font-family="sans-serif" font-weight="800" font-size="13" text-anchor="middle" fill="#047857" letter-spacing="1">OILS</text>
    <text x="400" y="408" font-family="sans-serif" font-weight="600" font-size="8" text-anchor="middle" fill="#059669">WELLNESS BLENDS</text>
  </g>
</svg>
